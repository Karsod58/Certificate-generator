version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: Run API in Docker
  # Uncomment to run the FastAPI app in a container
  # api:
  #   build: .
  #   command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - .:/app
  #     - ./output:/app/output
  #   environment:
  #     - DATABASE_URL=sqlite:///./certificates.db
  #     - REDIS_URL=redis://redis:6379/0
  #     - OUTPUT_DIR=/app/output
  #   depends_on:
  #     redis:
  #       condition: service_healthy

  # Optional: Run Celery worker in Docker
  # Uncomment to run the worker in a container
  # worker:
  #   build: .
  #   command: celery -A app.tasks worker --loglevel=info --pool=prefork --concurrency=4
  #   volumes:
  #     - .:/app
  #     - ./output:/app/output
  #   environment:
  #     - DATABASE_URL=sqlite:///./certificates.db
  #     - REDIS_URL=redis://redis:6379/0
  #     - OUTPUT_DIR=/app/output
  #   depends_on:
  #     redis:
  #       condition: service_healthy

volumes:
  redis_data:
